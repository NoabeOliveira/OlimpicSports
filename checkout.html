<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar Compra - OlimpicSports</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="py-4 text-center">
        <a href="index.html" class="text-decoration-none">
            <h2 class="text-white">
                Olimpic<span style="color:#72e52d">Sports</span>
            </h2>
        </a>
    </header>

    <main class="container py-5">

        <h2 class="mb-4">Finalizar Compra</h2>

        <div class="row g-4">

            <section class="col-md-6">

                <h4>Resumo do pedido</h4>
                <div id="resumoPedido" class="mb-3" aria-live="polite"></div>
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" class="form-control mb-3" min="1" max="99" value="1">
                <h4 id="valorTotal"></h4>

            </section>

            <section class="col-md-6">

                <h4>Dados do comprador</h4>

                <form id="formCompra">

                    <label for="nomeCliente">Nome completo</label>
                    <input
                        type="text"
                        id="nomeCliente"
                        class="form-control mb-3"
                        required>

                    <label for="emailCliente">E-mail</label>
                    <input
                        type="email"
                        id="emailCliente"
                        class="form-control mb-3"
                        required>

                    <label for="pagamento">Forma de pagamento</label>

                    <select id="pagamento" class="form-select mb-3" required>
                        <option value="">Selecione</option>
                        <option value="pix">PIX</option>
                        <option value="cartao">Cartão de crédito</option>
                        <option value="boleto">Boleto</option>
                    </select>
                    <!-- Opções de cartão -->
<div id="areaCartao" style="display: none;">

    <label for="parcelas">Número de parcelas</label>

    <select id="parcelas" class="form-select mb-3">
        <option value="">Selecione as parcelas</option>
    </select>

    <p id="resumoParcelas"></p>

</div>

<!-- Opções de PIX -->
<div id="areaPix" style="display: none;">

    <h5>Pagamento via PIX</h5>

    <div id="qrcodePix"></div>

    <p class="mt-3 text-muted">
        QR Code demonstrativo.
        Nenhuma cobrança será realizada.
    </p>

</div>

<!-- Opções de boleto -->
<div id="areaBoleto" style="display: none;">
    <p>Boleto demonstrativo, sem cobrança real.</p>
</div>

                    <button id="confirmarCompra" type="submit" class="btn btn-success w-100">
                        Confirmar Compra
                    </button>

                </form>

                <p id="mensagemCompra" class="mt-3" role="status"></p>

            </section>

        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
